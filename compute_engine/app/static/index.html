<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gemini</title>
  <link rel="icon" type="image/svg+xml" href="/static/gemini-icon.svg">

  <!-- Google Fonts: Pretendard & Inter & Material Symbols -->
  <link rel="stylesheet" as="style" crossorigin
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

  <!-- Highlight.js for Code Highlighting -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css"
    id="hljs-style">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

  <!-- Marked for Markdown Parsing -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <!-- Custom Styles -->
  <link rel="stylesheet" href="/static/css/style.css">
</head>

<body class="light-mode">
  <div class="app-layout" id="appLayout">

    <!-- Left Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <button class="icon-btn" id="sidebarCollapseBtn" title="메뉴 접기">
          <span class="material-symbols-rounded">menu</span>
        </button>
        <div class="brand-wrap">
          <img src="/static/gemini-icon.svg" alt="Gemini" class="brand-logo-icon">
          <span class="brand-title">Gemini</span>
        </div>
      </div>

      <div class="sidebar-action">
        <button class="new-chat-btn" id="newChatBtn">
          <span class="material-symbols-rounded">add</span>
          <span class="btn-text">새 채팅</span>
        </button>
      </div>

      <div class="sidebar-history-section">
        <div class="section-title">최근 대화</div>
        <div class="history-list" id="historyList">
          <!-- Dynamically populated -->
        </div>
      </div>

      <div class="sidebar-footer">
        <div class="model-badge-info" id="currentModelInfo">
          <img src="/static/gemini-icon.svg" alt="Gemini" class="footer-gemini-icon">
          <span class="model-label-text">Gemini 3.8 Flash</span>
        </div>
        <div class="footer-links">
          <span class="status-indicator active" id="apiStatusDot"></span>
          <span class="status-text" id="apiStatusText">연결됨</span>
        </div>
      </div>
    </aside>

    <!-- Main Content Area -->
    <main class="main-content" id="mainContent">

      <!-- Top Header Navigation -->
      <header class="top-nav">
        <div class="top-nav-left">
          <button class="icon-btn" id="sidebarOpenBtn" title="사이드바 열기">
            <span class="material-symbols-rounded">menu</span>
          </button>
          <span class="top-logo"></span>
        </div>
        <div class="top-nav-right">
          <!-- Header Model Switcher (Visible in mobile/desktop) -->
          <div class="header-model-pill" id="headerModelSelector" title="AI 모델 선택">
            <img src="/static/gemini-icon.svg" alt="Gemini" class="pill-gemini-icon">
            <span class="model-name" id="headerModelName">Flash 3.8</span>
            <span class="material-symbols-rounded pill-arrow">expand_more</span>
          </div>
          <button class="icon-btn profile-btn" title="로컬 서버 상태">
            <span class="material-symbols-rounded">dns</span>
          </button>
        </div>
      </header>

      <!-- Welcome Hero (Initial State matching user screenshot) -->
      <div class="welcome-screen" id="welcomeScreen">
        <div class="hero-container">
          <h1 class="hero-title">언제든지 시작하세요</h1>
        </div>
      </div>

      <!-- Chat Messages Container (Hidden initially, active upon interaction) -->
      <div class="chat-container" id="chatContainer">
        <div class="messages-wrapper" id="messagesWrapper">
          <!-- Messages dynamically appended here -->
        </div>
      </div>

      <!-- Prompt Input Container (Centered initially, pinned at bottom during chat) -->
      <div class="prompt-section" id="promptSection">
        <div class="prompt-bar-container">

          <form class="prompt-bar" id="promptForm" onsubmit="return false;">

            <!-- Left Action Button (+) -->
            <button type="button" class="bar-action-btn" id="attachBtn" title="추가 옵션">
              <span class="material-symbols-rounded">add</span>
            </button>

            <!-- Official Gemini Sparkle Icon -->
            <div class="gemini-symbol-wrap" title="Gemini 3.8 / 3.7 Flash">
              <img src="/static/gemini-icon.svg" alt="Gemini" class="gemini-sparkle-icon">
            </div>

            <!-- Auto-growing Textarea Input -->
            <div class="input-wrapper">
              <textarea id="promptInput" rows="1" placeholder="Gemini에게 물어보기" autocomplete="off"
                spellcheck="false"></textarea>
            </div>

            <!-- Right Controls: Search Toggle, Model Pill, Mic, Send -->
            <div class="prompt-right-tools">

              <!-- Web Search Toggle Button -->
              <button type="button" class="bar-tool-btn search-toggle-btn active" id="searchToggleBtn"
                title="웹 실시간 검색 켜짐 (클릭하여 끄기)">
                <span class="material-symbols-rounded">travel_explore</span>
              </button>

              <!-- Model Pill Dropdown Trigger -->
              <div class="model-select-pill" id="modelSelectTrigger" title="모델 변경">
                <span class="model-pill-text" id="modelPillText">Flash</span>
                <span class="material-symbols-rounded dropdown-arrow">expand_more</span>
              </div>

              <!-- Voice Input (Mic) Button -->
              <button type="button" class="bar-tool-btn mic-btn" id="micBtn" title="음성으로 입력하기">
                <span class="material-symbols-rounded">mic</span>
              </button>

              <!-- Send Button -->
              <button type="button" class="bar-tool-btn send-btn" id="sendBtn" title="메시지 전송" disabled>
                <span class="material-symbols-rounded">arrow_upward</span>
              </button>

            </div>

          </form>

          <!-- Model Selection Dropdown Menu Modal -->
          <div class="model-dropdown-menu" id="modelDropdownMenu">
            <div class="dropdown-header">AI 모델 선택</div>
            <div class="model-option active" data-model="gemini-3.8-flash">
              <div class="option-header">
                <span class="option-title">Gemini 3.8 Flash</span>
                <span class="option-tag default-tag">기본</span>
              </div>
              <p class="option-desc">가장 빠르고 강력한 최신 추론 성능 제공</p>
            </div>
            <div class="model-option" data-model="gemini-3.7-flash">
              <div class="option-header">
                <span class="option-title">Gemini 3.7 Flash</span>
                <span class="option-tag">안정성</span>
              </div>
              <p class="option-desc">검증된 고성능 및 안정적인 멀티턴 대화</p>
            </div>
          </div>

          <!-- Attach Options Menu Modal -->
          <div class="attach-menu" id="attachMenu">
            <button class="attach-item" id="clearHistoryBtn">
              <span class="material-symbols-rounded">delete_outline</span>
              <span>현재 대화 초기화</span>
            </button>
            <button class="attach-item" id="presetSummaryBtn">
              <span class="material-symbols-rounded">summarize</span>
              <span>요약 프롬프트 템플릿</span>
            </button>
            <button class="attach-item" id="presetCodeBtn">
              <span class="material-symbols-rounded">code</span>
              <span>코드 리뷰 프롬프트 템플릿</span>
            </button>
          </div>

        </div>
      </div>

      <!-- Bottom Disclaimer (Anchored to bottom center of screen) -->
      <div class="prompt-disclaimer">
        Gemini는 실수를 할 수 있습니다. 중요한 정보는 재확인하세요.
      </div>

    </main>
  </div>

  <!-- Voice Listening Modal / Toast -->
  <div class="voice-indicator-toast" id="voiceToast">
    <div class="wave-animation">
      <span></span><span></span><span></span><span></span>
    </div>
    <span class="voice-text">음성을 듣고 있습니다...</span>
    <button class="voice-stop-btn" id="voiceStopBtn">중지</button>
  </div>

  <!-- Application Script -->
  <script src="/static/js/app.js"></script>
</body>

</html>
